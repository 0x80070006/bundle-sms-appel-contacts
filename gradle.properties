org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Package prefix of the three apps: <prefix>.contacts, <prefix>.phone, <prefix>.messages.
# Change it once, here, before the first public release (Android ties updates to the id).
# apps/messages reads this file too.
bundle.appIdPrefix=app.bundle

# The bundle's version: the GitHub release tag (without the v) the three apps belong to.
# The in-app updater compares it with the latest release. Raise it with every release.
bundle.version=0.7.0
